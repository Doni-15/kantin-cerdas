# ============================================================================
# KANTINCERDAS — SUPABASE CLI & LOCAL/STAGING CONFIGURATION
# ============================================================================
project_id = "kantin-cerdas"

[api]
enabled = true
port = 54321
# Hanya ekspos skema public (seluruh tabel & fungsi di dalamnya sudah dikunci
# hanya untuk service_role melalui REVOKE ALL FROM PUBLIC, anon, authenticated).
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# PENTING (Modul K): Pendaftaran publik langsung ke GoTrue (/auth/v1/signup)
# DIMATIKAN agar seluruh registrasi wajib melewati server backend (/v1/auth/register)
# yang memanggil Admin API + rpc_register_user_profile secara atomik.
enable_signup = false
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
 token_refresh = 60
 sign_in_sign_ups = 20

[storage]
enabled = true
file_size_limit = "2MB"
