name: Tugas Pengembangan
description: Buat tugas berdasarkan roadmap atau checklist KantinCerdas.
title: "[TASK] "
body:
  - type: input
    id: task_id
    attributes:
      label: ID tugas
      description: Gunakan ID yang tercantum pada UI Checklist.
      placeholder: UI-201
    validations:
      required: true
  - type: dropdown
    id: target_version
    attributes:
      label: Target versi
      options:
        - v0.1.0-alpha.1
        - v0.1.0-alpha.2
        - v0.2.0-alpha.1
        - v0.3.0-alpha.1
        - v0.4.0-alpha.1
        - v0.5.0-alpha.1
        - v0.6.0-alpha.1
        - v0.7.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area pekerjaan
      options:
        - Fondasi proyek
        - Design system
        - Alur mahasiswa
        - Asisten AI
        - Keranjang dan pesanan
        - Panel pengelola
        - Notifikasi Android
        - Dokumentasi atau CI
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Tujuan
      description: Jelaskan hasil yang harus dicapai.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Kriteria pertama
        - [ ] Kriteria kedua
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Pemeriksaan awal
      options:
        - label: Scope tugas sudah jelas dan tidak mencampur beberapa fitur besar.
          required: true
