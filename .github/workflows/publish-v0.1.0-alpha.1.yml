name: Publish v0.1.0-alpha.1

on:
  workflow_run:
    workflows:
      - Flutter CI
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish prerelease
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore(release): publish v0.1.0-alpha.1')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RELEASE_TAG: v0.1.0-alpha.1
      RELEASE_TITLE: KantinCerdas v0.1.0-alpha.1
      RELEASE_NOTES: docs/releases/v0.1.0-alpha.1.md
      EXPECTED_VERSION: 0.1.0-alpha.1+1
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify release inputs
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          grep -Fxq "version: $EXPECTED_VERSION" apps/mobile/pubspec.yaml
          test -s "$RELEASE_NOTES"

      - name: Create tag and GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          then
            git fetch --force origin \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$TARGET_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email \
              '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --annotate "$RELEASE_TAG" "$TARGET_SHA" \
              --message "$RELEASE_TITLE"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            printf 'Release %s already exists\n' "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES"
          fi

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,url
