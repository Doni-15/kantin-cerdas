name: Kantin Cerdas CI

on:
  push:
    branches:
      - rebuild/clean-start
      - main
  pull_request:
    branches:
      - rebuild/clean-start
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DART_VERSION: "3.12.2"
  FLUTTER_VERSION: "3.44.9"
  JAVA_VERSION: "17"

jobs:
  hygiene:
    name: Hygiene & Secret Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check no secret env, Firebase, or keystore files tracked in Git
        run: |
          set -euo pipefail
          tracked_secrets=$(git ls-files | grep -iE '(^|/)(\.env(\..+)?|key\.properties|google-services\.json|dart_defines\.json|.*firebase-adminsdk.*\.json|.*service-account.*\.json|.*\.(jks|keystore|pem|p12|p8))$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$tracked_secrets" ]; then
            echo "ERROR: Secret/keystore/Firebase files must never be tracked in Git:"
            echo "$tracked_secrets"
            exit 1
          fi

          # git grep exits 0 on matches, 1 on no matches, >1 on errors.
          # Never treat scanner errors as a clean result or print matched secret values.
          scan_tracked_pattern() {
            local description="$1" pattern="$2" matches status=0
            matches=$(git grep -lI -E -e "$pattern" -- .) || status=$?
            if [ "$status" -gt 1 ]; then
              echo "ERROR: Secret scan failed while checking $description (exit $status)."
              exit "$status"
            fi
            if [ "$status" -eq 0 ]; then
              echo "ERROR: Potential $description found in tracked files:"
              echo "$matches"
              exit 1
            fi
          }

          scan_tracked_pattern 'Supabase secret key' 'sb_secret_[A-Za-z0-9_-]{24,}'
          scan_tracked_pattern 'Google/Firebase/Gemini API key' '(AIza[0-9A-Za-z_-]{30,}|AQ\.[0-9A-Za-z_-]{30,})'
          scan_tracked_pattern 'private key PEM block' '-----BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'

          if [ -e ".github/workflows/cd-release.yml" ]; then
            echo "ERROR: Legacy cd-release.yml must be removed before integrating to main (old project ref and automatic database migrations)."
            exit 1
          fi
      - name: Run git diff --check on changed code, SQL, and config commits
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD" -- . ':!*.md'
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD -- . ':!*.md'
          else
            git diff-tree --root --check -r HEAD -- . ':!*.md'
          fi
  backend:
    name: Dart Backend Analyze & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK (pinned)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Install backend dependencies (lockfile enforced)
        run: dart pub get --enforce-lockfile

      - name: Analyze backend
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Run backend architecture boundary tests
        run: dart test test/architecture/architecture_boundary_test.dart

      - name: Run backend tests
        run: dart test

  sql-migrations:
    name: PostgreSQL 16 Disposable Migration & SQL Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply provider fixture, forward migrations, and SQL test suites
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f server/supabase/tests/fixtures/provider_schema.sql >/dev/null
          migrations=(server/supabase/migrations/*.sql)
          if [ ! -f "${migrations[0]}" ]; then
            echo "ERROR: No SQL migration files found."
            exit 1
          fi
          for f in "${migrations[@]}"; do
            echo "Applying migration: $f"
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f" >/dev/null
          done
          for suite in auth.sql owner.sql catalog_compat.sql customer.sql admin.sql ai.sql realtime_push.sql; do
            path="server/supabase/tests/$suite"
            if [ ! -f "$path" ]; then
              echo "ERROR: Required SQL test suite missing: $path"
              exit 1
            fi
            echo "Running SQL suite: $suite"
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$path" >/dev/null
          done
  flutter:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter app & tests
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings lib test

      - name: Run Flutter architecture boundary tests
        run: flutter test --no-pub test/architecture/architecture_boundary_test.dart

      - name: Run Flutter unit & widget tests
        run: flutter test --no-pub

  android-debug-apk:
    name: Android Debug APK Build & Artifact
    runs-on: ubuntu-latest
    needs:
      - flutter
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (matches build.gradle.kts)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter SDK (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: Build Android Debug APK (testing artifact only)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
        run: flutter build apk --debug --no-pub

      - name: Generate SHA-256 checksum for Debug APK
        run: |
          set -euo pipefail
          (
            cd build/app/outputs/flutter-apk
            sha256sum app-debug.apk > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Upload Android Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kantin-cerdas-android-debug-apk
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 7

  docker-backend:
    name: Backend Docker Build & Startup Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -f server/backend/Dockerfile -t kantin-cerdas-backend:ci server/backend

      - name: Verify non-root user, no embedded .env, Railway PORT mapping, and strict Host/healthcheck guard
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id kantin-cerdas-backend:ci -u)
          echo "Container UID: $uid"
          test "$uid" != "0"

          if docker run --rm --entrypoint sh kantin-cerdas-backend:ci -c 'test -e /app/.env'; then
            echo "ERROR: .env found inside container image"
            exit 1
          fi

          cid=$(docker run -d --rm -p 18080:18080 \
            -e APP_ENV=staging \
            -e APP_DEBUG=false \
            -e PORT=18080 \
            -e SUPABASE_URL=https://aaaaaaaaaaaaaaaaaaaa.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder \
            -e SUPABASE_SECRET_KEY=sb_secret_ci_placeholder \
            -e AUTH_JWT_AUDIENCE=authenticated \
            -e AUTH_JWT_ALLOWED_ALGORITHMS=ES256 \
            -e SECURITY_ALLOWED_HOSTS=kantin-ci.up.railway.app,healthcheck.railway.app \
            -e CORS_ENABLED=false \
            -e STORAGE_BUCKET_NAME=kantin-media \
            -e RATE_LIMIT_ENABLED=false \
            -e AI_PROVIDER_ENABLED=false \
            -e FCM_ENABLED=false \
            -e FCM_WORKER_ENABLED=false \
            kantin-cerdas-backend:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          ready=false
          for i in $(seq 1 40); do
            if curl -fsS -H 'Host: healthcheck.railway.app' http://127.0.0.1:18080/v1/health | grep -q '"status":"ok"'; then
              ready=true
              break
            fi
            sleep 0.5
          done

          if [ "$ready" != "true" ]; then
            docker logs "$cid"
            exit 1
          fi

          curl -fsS -H 'Host: kantin-ci.up.railway.app' http://127.0.0.1:18080/v1/health | grep -q '"status":"ok"'
          blocked_code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example.com' http://127.0.0.1:18080/v1/health)
          test "$blocked_code" = "403"
          echo "Docker container healthcheck and strict Railway Host guard passed on PORT=18080"

  ci-gate:
    name: CI Required Gate
    runs-on: ubuntu-latest
    needs:
      - hygiene
      - backend
      - sql-migrations
      - flutter
      - android-debug-apk
      - docker-backend
    if: always()
    steps:
      - name: Enforce all required checks succeeded (never pass on skipped)
        run: |
          set -euo pipefail
          for status in \
            "${{ needs.hygiene.result }}" \
            "${{ needs.backend.result }}" \
            "${{ needs.sql-migrations.result }}" \
            "${{ needs.flutter.result }}" \
            "${{ needs.android-debug-apk.result }}" \
            "${{ needs.docker-backend.result }}"; do
            if [ "$status" != "success" ]; then
              echo "CI Gate failed: one or more required jobs did not succeed."
              exit 1
            fi
          done
          echo "All CI required checks passed."