name: CI/CD — KantinCerdas Pipeline

on:
  push:
    branches:
      - main
      - staging
      - develop
      - "KantinCerdas*"
  pull_request:
    branches:
      - main
      - staging
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  SUPABASE_PROJECT_REF: "diprwrdomyqrhllqlche"

jobs:
  # ============================================================================
  # 1. REPOSITORY SECURITY, SECRET LEAK GUARD & SUPABASE SQL AUDIT
  # ============================================================================
  security-and-sql-guard:
    name: Security Guard & Supabase Migration Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for tracked secret files (.env, keystores, local configs)
        run: |
          FORBIDDEN_FILES=$(git ls-files | grep -E '(^|/)\.env$|(^|/)key\.properties$|\.jks$|\.keystore$|(^|/)dart_defines\.json$' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::Tracked secret/local configuration files detected:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi

      - name: Scan tracked files for leaked Supabase secret keys
        run: |
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{16,}' -- ':!*.example' ':!*.md'; then
            echo "::error::Leaked Supabase secret key (sb_secret_...) detected in tracked files."
            exit 1
          fi

      - name: Validate Supabase SQL migrations structure
        run: |
          MIGRATION_DIR="server/supabase/migrations"
          if [ ! -d "$MIGRATION_DIR" ]; then
            echo "::error::Migration directory $MIGRATION_DIR not found."
            exit 1
          fi

          COUNT=$(find "$MIGRATION_DIR" -maxdepth 1 -name '*.sql' | wc -l)
          if [ "$COUNT" -lt 12 ]; then
            echo "::error::Expected at least 12 SQL migration files in $MIGRATION_DIR, found $COUNT."
            exit 1
          fi

          for sql_file in "$MIGRATION_DIR"/*.sql; do
            if ! grep -q "^BEGIN;" "$sql_file" || ! grep -q "^COMMIT;" "$sql_file"; then
              echo "::error::Migration $sql_file must be wrapped in BEGIN; ... COMMIT; transaction block."
              exit 1
            fi
          done

  # ============================================================================
  # 2. BACKEND CI — DART SHELF SERVER (/v1/*)
  # ============================================================================
  backend-ci:
    name: Backend (Dart Shelf) — Format, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK (stable)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install backend dependencies
        run: dart pub get

      - name: Check Dart formatting (bin, lib, test)
        run: |
          DART_FILES=$(find bin lib test -name '*.dart' 2>/dev/null || true)
          if [ -n "$DART_FILES" ]; then
            dart format --output=none --set-exit-if-changed $DART_FILES
          else
            echo "No .dart files in server/backend yet — skipping format check."
          fi

      - name: Run strict Dart analyzer
        run: |
          DART_FILES=$(find bin lib test -name '*.dart' 2>/dev/null || true)
          if [ -n "$DART_FILES" ]; then
            dart analyze --fatal-infos --fatal-warnings
          else
            echo "No .dart files in server/backend yet — skipping static analysis."
          fi

      - name: Run backend test suite
        run: |
          TEST_FILES=$(find test -name '*_test.dart' 2>/dev/null || true)
          if [ -n "$TEST_FILES" ]; then
            dart test --reporter expanded
          else
            echo "No *_test.dart files in server/backend/test yet — skipping tests."
          fi

  # ============================================================================
  # 3. FRONTEND CI — FLUTTER CLIENT (app/)
  # ============================================================================
  flutter-ci:
    name: Flutter App — Format, Analyze, Architecture & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run strict Flutter analyzer
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings lib test

      - name: Verify Clean Architecture & simulation isolation boundaries
        run: flutter test --no-pub --reporter expanded test/audit/architecture_boundary_test.dart

      - name: Run full Flutter test suite
        run: flutter test --no-pub --reporter expanded

  # ============================================================================
  # 4. BUILD ARTIFACTS — ANDROID DEBUG APKs (NORMAL & SIMULATION)
  # ============================================================================
  build-debug-apks:
    name: Build Debug APKs (Normal & Simulation)
    needs:
      - security-and-sql-guard
      - flutter-ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (${{ env.JAVA_VERSION }})
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK — Entry Normal (REST API)
        env:
          STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: |
          mkdir -p build/ci-artifacts
          if [ -n "$STAGING_API_BASE_URL" ]; then
            flutter build apk --debug --no-pub -t lib/main.dart \
              --dart-define=API_BASE_URL="$STAGING_API_BASE_URL"
          else
            flutter build apk --debug --no-pub -t lib/main.dart
          fi
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/ci-artifacts/kantin-cerdas-normal-debug.apk

      - name: Build Debug APK — Entry Simulasi (Offline Demo)
        run: |
          flutter build apk --debug --no-pub -t test/support/main_simulation.dart
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/ci-artifacts/kantin-cerdas-simulation-debug.apk
          cd build/ci-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kantin-cerdas-debug-apks-${{ github.sha }}
          path: |
            app/build/ci-artifacts/kantin-cerdas-normal-debug.apk
            app/build/ci-artifacts/kantin-cerdas-simulation-debug.apk
            app/build/ci-artifacts/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

  # ============================================================================
  # 5. SUPABASE CLOUD CD — AUTO PUSH MIGRATIONS ON MAIN (WHEN SECRETS EXIST)
  # ============================================================================
  supabase-cd:
    name: Supabase Cloud — Sync Database Migrations
    needs:
      - security-and-sql-guard
      - backend-ci
      - flutter-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push pending migrations to Supabase Cloud
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD secret is not configured in GitHub Settings. Skipping remote db push."
            exit 0
          fi
          supabase link --project-ref "${{ env.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --remote