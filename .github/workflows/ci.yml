name: CI — KantinCerdas

# CI hanya MEMERIKSA kode. Tidak ada deploy dan tidak ada push migration ke
# Supabase production di workflow ini.

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  # Opsional: isi di Settings > Secrets and variables > Actions > Variables.
  # Kosong = pakai versi terbaru channel stable. Isi supaya build reproducible.
  #   FLUTTER_VERSION  -> hasil `flutter --version`, contoh 3.35.0
  #   DART_VERSION     -> versi Dart untuk backend, contoh 3.9.0
  #   SUPABASE_CLI_VERSION -> contoh 2.40.7

jobs:
  # ==========================================================================
  # 1. SECURITY GUARD & VALIDASI STRUKTUR MIGRATION
  # ==========================================================================
  security-and-sql-guard:
    name: Security Guard & Migration Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Cek file rahasia yang ter-track
        run: |
          FORBIDDEN=$(git ls-files | grep -E '(^|/)\.env$|(^|/)key\.properties$|\.jks$|\.keystore$|(^|/)dart_defines\.json$|(^|/)google-services\.json$' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::File rahasia/konfigurasi lokal ter-track di git:"
            echo "$FORBIDDEN"
            exit 1
          fi

      - name: Scan kunci rahasia yang bocor
        run: |
          # sb_secret_... dan JWT service_role (eyJ...) ukuran panjang
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{30,}\.eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{20,}' -- ':!*.example' ':!*.md'; then
            echo "::error::Kemungkinan kunci rahasia bocor di file yang ter-track."
            exit 1
          fi

      - name: Validasi struktur file migration
        run: |
          DIR="server/supabase/migrations"
          if [ ! -d "$DIR" ]; then
            echo "::error::Folder $DIR tidak ditemukan."
            exit 1
          fi
          shopt -s nullglob
          FILES=("$DIR"/*.sql)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::Tidak ada file .sql di $DIR."
            exit 1
          fi
          for f in "${FILES[@]}"; do
            name=$(basename "$f")
            if ! [[ "$name" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error::Nama migration '$name' harus berformat YYYYMMDDHHMMSS_nama_snake_case.sql"
              exit 1
            fi
            if ! grep -q "^BEGIN;" "$f" || ! grep -q "^COMMIT;" "$f"; then
              echo "::error::Migration $name harus dibungkus BEGIN; ... COMMIT;"
              exit 1
            fi
          done
          # Timestamp ganda membuat urutan migration ambigu
          DUP=$(printf '%s\n' "${FILES[@]##*/}" | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$DUP" ]; then
            echo "::error::Timestamp migration ganda: $DUP"
            exit 1
          fi

  # ==========================================================================
  # 2. MIGRATION DIJALANKAN DI DATABASE SEMENTARA (BUKAN PRODUCTION)
  # ==========================================================================
  migrations-test:
    name: Migrations — Apply on Throwaway Postgres
    needs: security-and-sql-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ vars.SUPABASE_CLI_VERSION || 'latest' }}

      - name: Start local Supabase & apply all migrations
        run: |
          supabase start
          supabase db reset

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  # ==========================================================================
  # 3. BACKEND (DART SHELF)
  # ==========================================================================
  backend-ci:
    name: Backend (Dart Shelf) — Format, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/backend
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ vars.DART_VERSION || 'stable' }}

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-backend-${{ runner.os }}-${{ hashFiles('server/backend/pubspec.lock', 'server/backend/pubspec.yaml') }}
          restore-keys: pub-backend-${{ runner.os }}-

      - name: Install dependencies
        run: dart pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed bin lib test

      - name: Strict analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Tests
        run: |
          TEST_FILES=$(find test -name '*_test.dart' 2>/dev/null || true)
          if [ -z "$TEST_FILES" ]; then
            echo "::warning::Belum ada test backend. Tambahkan test untuk auth (register/availability) secepatnya."
            exit 0
          fi
          dart test --reporter expanded

  # ==========================================================================
  # 4. FLUTTER APP
  # ==========================================================================
  flutter-ci:
    name: Flutter App — Format, Analyze, Architecture & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Strict analyze
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings lib test

      - name: Architecture & simulation boundary audit
        run: flutter test --no-pub --reporter expanded test/audit/architecture_boundary_test.dart

      - name: Full test suite (with coverage)
        run: flutter test --no-pub --reporter expanded --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ github.sha }}
          path: app/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================
  # 5. DEBUG APK — hanya di main / manual (hemat menit runner)
  # ==========================================================================
  build-debug-apks:
    name: Build Debug APKs (Normal & Simulation)
    needs: [security-and-sql-guard, flutter-ci]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Debug APK — Normal (REST API)
        env:
          STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: |
          mkdir -p build/ci-artifacts
          if [ -n "$STAGING_API_BASE_URL" ]; then
            flutter build apk --debug --no-pub -t lib/main.dart \
              --dart-define=API_BASE_URL="$STAGING_API_BASE_URL"
          else
            flutter build apk --debug --no-pub -t lib/main.dart
          fi
          cp build/app/outputs/flutter-apk/app-debug.apk build/ci-artifacts/kantin-cerdas-normal-debug.apk

      - name: Build Debug APK — Simulasi (Offline Demo)
        run: |
          flutter build apk --debug --no-pub -t test/support/main_simulation.dart
          cp build/app/outputs/flutter-apk/app-debug.apk build/ci-artifacts/kantin-cerdas-simulation-debug.apk
          cd build/ci-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kantin-cerdas-debug-apks-${{ github.sha }}
          path: |
            app/build/ci-artifacts/kantin-cerdas-normal-debug.apk
            app/build/ci-artifacts/kantin-cerdas-simulation-debug.apk
            app/build/ci-artifacts/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

  # ==========================================================================
  # 6. GERBANG TUNGGAL — jadikan ini satu-satunya "required check" di
  #    branch protection, supaya job baru tidak perlu didaftarkan satu-satu.
  # ==========================================================================
  ci-success:
    name: CI Success
    if: always()
    needs: [security-and-sql-guard, migrations-test, backend-ci, flutter-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Gagalkan jika ada job yang gagal atau dibatalkan
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Ada job CI yang gagal atau dibatalkan."
            exit 1
          fi
          echo "Semua job CI hijau."