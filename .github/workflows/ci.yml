name: CI — KantinCerdas

# Workflow ini hanya MEMERIKSA kode (format, analisis statis, test, audit
# keamanan). Tidak ada deploy dan tidak ada migration ke Supabase production.

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]
  workflow_dispatch:

# Run lama pada PR dibatalkan saat ada commit baru. Run pada branch utama
# tidak dibatalkan, supaya setiap push ke main tetap punya hasil lengkap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  # Variabel opsional (Settings > Secrets and variables > Actions > Variables).
  # Kosong = memakai versi stable/latest. Isi agar build reproducible:
  #   FLUTTER_VERSION       contoh: 3.35.0
  #   DART_VERSION          contoh: 3.9.0
  #   SUPABASE_CLI_VERSION  contoh: 2.40.7
  #   STAGING_API_BASE_URL  URL API staging untuk APK debug normal

jobs:
  # ===========================================================================
  # 1. Security guard & audit struktur migration
  # ===========================================================================
  security-and-sql-guard:
    name: Security Guard & Migration Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pastikan tidak ada file rahasia yang ter-track
        run: |
          FORBIDDEN=$(git ls-files | grep -E '(^|/)\.env$|(^|/)key\.properties$|\.jks$|\.keystore$|(^|/)dart_defines\.json$|(^|/)google-services\.json$' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::File rahasia atau konfigurasi lokal ter-track di git:"
            echo "$FORBIDDEN"
            exit 1
          fi

      - name: Pindai kunci rahasia yang bocor
        run: |
          # Mendeteksi sb_secret_... dan JWT (eyJ...) berukuran panjang.
          # Jika ada false positive dari fixture test, tambahkan pengecualian
          # path (contoh: ':!app/test/**') setelah memastikan isinya palsu.
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{30,}\.eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{20,}' -- ':!*.example' ':!*.md'; then
            echo "::error::Kemungkinan kunci rahasia bocor di file yang ter-track."
            exit 1
          fi

      - name: Validasi struktur file migration
        run: |
          DIR="server/supabase/migrations"
          if [ ! -d "$DIR" ]; then
            echo "::error::Folder $DIR tidak ditemukan."
            exit 1
          fi

          shopt -s nullglob
          FILES=("$DIR"/*.sql)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::Tidak ada file .sql di $DIR."
            exit 1
          fi

          for f in "${FILES[@]}"; do
            name=$(basename "$f")
            if ! [[ "$name" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error::Nama migration '$name' harus berformat YYYYMMDDHHMMSS_nama_snake_case.sql"
              exit 1
            fi
            if ! grep -q "^BEGIN;" "$f" || ! grep -q "^COMMIT;" "$f"; then
              echo "::error::Migration '$name' harus dibungkus BEGIN; ... COMMIT;"
              exit 1
            fi
          done

          # Timestamp ganda membuat urutan migration menjadi ambigu.
          DUP=$(printf '%s\n' "${FILES[@]##*/}" | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$DUP" ]; then
            echo "::error::Timestamp migration ganda: $DUP"
            exit 1
          fi

  # ===========================================================================
  # 2. Migration dijalankan pada database sementara (bukan production)
  # ===========================================================================
  migrations-test:
    name: Migrations (Throwaway Postgres)
    needs: security-and-sql-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ vars.SUPABASE_CLI_VERSION || 'latest' }}

      - name: Jalankan Supabase lokal dan terapkan seluruh migration
        run: |
          supabase start
          supabase db reset

      - name: Hentikan Supabase lokal
        if: always()
        run: supabase stop --no-backup

  # ===========================================================================
  # 3. Backend (Dart Shelf)
  # ===========================================================================
  backend-ci:
    name: Backend (Dart Shelf)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ vars.DART_VERSION || 'stable' }}

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-backend-${{ runner.os }}-${{ hashFiles('server/backend/pubspec.lock', 'server/backend/pubspec.yaml') }}
          restore-keys: pub-backend-${{ runner.os }}-

      - name: Install dependencies
        run: dart pub get

      - name: Format check
        run: |
          # Hanya memeriksa folder yang ada (folder test bisa belum dibuat).
          DIRS=$(for d in bin lib test; do if [ -d "$d" ]; then echo "$d"; fi; done)
          dart format --output=none --set-exit-if-changed $DIRS

      - name: Analyze (strict)
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Test
        run: |
          TEST_FILES=$(find test -name '*_test.dart' 2>/dev/null || true)
          if [ -z "$TEST_FILES" ]; then
            echo "::warning::Belum ada test backend. Tambahkan test untuk auth (register/availability) secepatnya."
            exit 0
          fi
          dart test --reporter expanded

  # ===========================================================================
  # 4. Aplikasi Flutter
  # ===========================================================================
  flutter-ci:
    name: Flutter App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze (strict)
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings lib test

      # Gerbang cepat: batas lapisan, isolasi simulasi, dan tata letak folder test.
      - name: Architecture audit
        run: flutter test --no-pub --reporter expanded test/architecture

      - name: Full test suite
        run: flutter test --no-pub --reporter expanded

  # ===========================================================================
  # 5. APK debug (hanya push ke main atau manual, untuk menghemat menit runner)
  # ===========================================================================
  build-debug-apks:
    name: Build Debug APKs (Normal & Simulation)
    needs: [security-and-sql-guard, flutter-ci]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK debug (normal, REST API)
        env:
          STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: |
          mkdir -p build/ci-artifacts
          if [ -n "$STAGING_API_BASE_URL" ]; then
            flutter build apk --debug --no-pub -t lib/main.dart \
              --dart-define=API_BASE_URL="$STAGING_API_BASE_URL"
          else
            flutter build apk --debug --no-pub -t lib/main.dart
          fi
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/ci-artifacts/kantin-cerdas-normal-debug.apk

      - name: Build APK debug (simulasi, demo offline)
        run: |
          flutter build apk --debug --no-pub -t test/support/main_simulation.dart
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/ci-artifacts/kantin-cerdas-simulation-debug.apk
          cd build/ci-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kantin-cerdas-debug-apks-${{ github.sha }}
          path: |
            app/build/ci-artifacts/kantin-cerdas-normal-debug.apk
            app/build/ci-artifacts/kantin-cerdas-simulation-debug.apk
            app/build/ci-artifacts/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

  # ===========================================================================
  # 6. Gerbang tunggal
  #    Jadikan "CI Success" satu-satunya required check di branch protection,
  #    sehingga job baru tidak perlu didaftarkan satu per satu.
  # ===========================================================================
  ci-success:
    name: CI Success
    if: always()
    needs: [security-and-sql-guard, migrations-test, backend-ci, flutter-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Gagalkan jika ada job yang gagal atau dibatalkan
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Ada job CI yang gagal atau dibatalkan."
          exit 1

      - name: Semua job lulus
        run: echo "Semua job CI lulus."