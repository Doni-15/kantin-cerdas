name: CI — Quality, Tests & Debug APK

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.9"
  JAVA_VERSION: "17"

jobs:
  quality-and-tests:
    name: Format, Analyze, Architecture Audit & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify documentation links & file inventory
        working-directory: .
        run: |
          python3 - << 'EOF'
          import glob, os, re, sys

          root = os.getcwd()
          errors = []

          active_mds = [
              p for p in sorted(glob.glob(os.path.join(root, "**/*.md"), recursive=True))
              if "/arsip/" not in p and "/build/" not in p and "/.dart_tool/" not in p
          ]

          for md in active_mds:
              rel_md = os.path.relpath(md, root)
              with open(md, encoding="utf-8") as f:
                  text = f.read()
              for m in re.finditer(r"\[([^\]]+)\]\(([^)]+)\)", text):
                  target = m.group(2).split("#")[0].strip()
                  if not target or target.startswith(("http://", "https://", "mailto:")):
                      continue
                  resolved = os.path.normpath(os.path.join(os.path.dirname(md), target))
                  if not os.path.exists(resolved):
                      errors.append(f"Broken link in {rel_md}: {target}")

          peta_path = os.path.join(root, "docs/backend/PETA_INTEGRASI_FILE.md")
          with open(peta_path, encoding="utf-8") as f:
              peta = f.read()

          for pattern in ("app/lib/**/*.dart", "app/test/**/*.dart"):
              for p in sorted(glob.glob(os.path.join(root, pattern), recursive=True)):
                  rel = os.path.relpath(p, root)
                  if f"`{rel}`" not in peta:
                      errors.append(f"File missing from PETA_INTEGRASI_FILE.md: {rel}")

          if errors:
              for err in errors:
                  print(f"::error::{err}")
              sys.exit(1)

          print(f"Documentation check passed ({len(active_mds)} markdown files verified).")
          EOF

      - name: Setup Flutter (${{ env.FLUTTER_VERSION }})
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies (enforce lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run strict Flutter analyzer
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings lib test

      - name: Verify Clean Architecture & simulation isolation boundaries
        run: flutter test --no-pub --reporter expanded test/audit/architecture_boundary_test.dart

      - name: Run full automated test suite
        run: flutter test --no-pub --reporter expanded

  build-debug-apks:
    name: Build Debug APKs (Normal & Simulation)
    needs: quality-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (${{ env.JAVA_VERSION }})
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter (${{ env.FLUTTER_VERSION }})
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies (enforce lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Build Debug APK — Entry Normal (REST API)
        env:
          STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: |
          mkdir -p build/ci-artifacts
          if [ -n "$STAGING_API_BASE_URL" ]; then
            flutter build apk --debug --no-pub -t lib/main.dart \
              --dart-define=API_BASE_URL="$STAGING_API_BASE_URL"
          else
            flutter build apk --debug --no-pub -t lib/main.dart
          fi
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/ci-artifacts/kantin-cerdas-normal-debug.apk

      - name: Build Debug APK — Entry Simulasi (Offline Demo)
        run: |
          flutter build apk --debug --no-pub -t test/support/main_simulation.dart
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/ci-artifacts/kantin-cerdas-simulation-debug.apk
          cd build/ci-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kantin-cerdas-debug-apks-${{ github.sha }}
          path: |
            app/build/ci-artifacts/kantin-cerdas-normal-debug.apk
            app/build/ci-artifacts/kantin-cerdas-simulation-debug.apk
            app/build/ci-artifacts/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
